name: Check OpenAvatars
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review-chromium
          path: artifacts/
          retention-days: 7
  webkit:
    # macOS WebKit provides the project's Safari coverage.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install webkit
      - name: Enable native motion for SVG image coverage
        # GitHub's macOS image enables Reduce Motion. WebKit SVG image documents
        # read the native preference instead of the host's emulated media value.
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          test "$(defaults read com.apple.universalaccess reduceMotion)" = "0"
      - id: webkit_e2e
        run: npm run test:e2e -- --project=webkit
      - name: Diagnose isolated SVG rendering after a failure
        if: failure() && steps.webkit_e2e.outcome == 'failure'
        run: npm run diagnose:svg -- --browser=webkit --isolated
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review-webkit
          path: artifacts/
          retention-days: 7
