name: Publish openavatars
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.1.0
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('packages/core/package.json', 'utf8'));
          if (!/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG) || process.env.RELEASE_TAG !== `v${pkg.version}`) {
            throw new Error('Choose a release tag that matches packages/core/package.json');
          }
          JS
      - run: npm ci
      - run: npm run release:check
      - run: npm publish -w openavatars --access public --provenance
